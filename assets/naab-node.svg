<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" font-family="'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace" role="img">
  <title>MH11 to NaaB Tech ecosystem diagram: founder node connecting to security, engineering, and AI branches</title>
  <defs>
    <linearGradient id="node-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e676"/>
      <stop offset="1" stop-color="#00e676" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="248" rx="16" fill="#0d1117" stroke="#21262d" stroke-width="2"/>

  <text x="40" y="38" font-size="14" fill="#8b949e">// mh11 → naab ecosystem</text>
  <text x="1160" y="38" font-size="14" fill="#00e676" text-anchor="end">● operational</text>

  <!-- founder node -->
  <rect x="40" y="70" width="230" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="155" y="115" font-size="30" font-weight="bold" fill="#f0f6fc" text-anchor="middle">MH11</text>
  <text x="155" y="140" font-size="15" fill="#8b949e" text-anchor="middle">whoismh11</text>
  <text x="155" y="162" font-size="13" fill="#00e676" text-anchor="middle">FOUNDER / CEO</text>

  <!-- company node -->
  <rect x="330" y="60" width="300" height="130" rx="12" fill="#0e1512" stroke="url(#node-border)" stroke-width="1.5"/>
  <text x="480" y="108" font-size="30" font-weight="bold" fill="#f0f6fc" text-anchor="middle">NaaB Tech</text>
  <text x="480" y="134" font-size="16" fill="#00e676" text-anchor="middle">naabtech.ir</text>
  <text x="480" y="158" font-size="14" fill="#8b949e" text-anchor="middle">security · software</text>

  <!-- founder to company -->
  <line x1="270" y1="125" x2="330" y2="125" stroke="#00e676" stroke-width="2"/>
  <circle cx="300" cy="125" r="4" fill="#00e676"/>

  <!-- branch connectors -->
  <line x1="630" y1="100" x2="700" y2="72" stroke="#30363d" stroke-width="2"/>
  <line x1="630" y1="125" x2="700" y2="128" stroke="#30363d" stroke-width="2"/>
  <line x1="630" y1="150" x2="700" y2="184" stroke="#30363d" stroke-width="2"/>

  <!-- branch chips -->
  <rect x="700" y="48" width="460" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="722" y="78" font-size="17" font-weight="bold" fill="#00e676">SECURITY</text>
  <text x="1138" y="77" font-size="14" fill="#8b949e" text-anchor="end">wstg-fa · hardening</text>

  <rect x="700" y="104" width="460" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="722" y="134" font-size="17" font-weight="bold" fill="#00e676">ENGINEERING</text>
  <text x="1138" y="133" font-size="14" fill="#8b949e" text-anchor="end">platforms · tooling · bots</text>

  <rect x="700" y="160" width="460" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="722" y="190" font-size="17" font-weight="bold" fill="#00e676">AI + SYSTEMS</text>
  <text x="1138" y="189" font-size="14" fill="#8b949e" text-anchor="end">vision lab · linux infra</text>

  <!-- staggered status pulses -->
  <circle cx="665" cy="86" r="5" fill="#00e676">
    <animate attributeName="opacity" values="0.9;0.15;0.9" dur="3s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="665" cy="126" r="5" fill="#00e676">
    <animate attributeName="opacity" values="0.9;0.15;0.9" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="665" cy="167" r="5" fill="#00e676">
    <animate attributeName="opacity" values="0.9;0.15;0.9" dur="3s" begin="2s" repeatCount="indefinite"/>
  </circle>
</svg>
