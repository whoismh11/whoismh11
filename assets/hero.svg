    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#00e676" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00e676" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="1278" height="378" rx="16" fill="url(#bg)" stroke="#21262d" stroke-width="2"/>
  <rect x="1" y="1" width="1278" height="378" rx="16" fill="url(#glow)"/>

