<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="140" viewBox="0 0 1280 140" font-family="'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace" role="img">
  <title>MH11 status bar: identity, focus areas, and online status</title>

  <rect x="1" y="1" width="1278" height="138" rx="14" fill="#0d1117" stroke="#21262d" stroke-width="2"/>

  <!-- identity pill -->
  <rect x="24" y="38" width="120" height="64" rx="32" fill="#00e676"/>
  <text x="84" y="79" font-size="26" font-weight="bold" fill="#0d1117" text-anchor="middle">MH11</text>

  <!-- handle pill -->
  <rect x="156" y="38" width="180" height="64" rx="32" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="246" y="78" font-size="23" fill="#f0f6fc" text-anchor="middle">whoismh11</text>

  <!-- focus pill -->
  <rect x="348" y="38" width="642" height="64" rx="32" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="669" y="77" font-size="21" fill="#c9d1d9" text-anchor="middle">cybersecurity <tspan fill="#00e676">·</tspan> software &amp; web dev <tspan fill="#00e676">·</tspan> networks</text>

  <!-- status pill -->
  <rect x="1092" y="38" width="164" height="64" rx="32" fill="#0e1512" stroke="#00e676" stroke-width="1.5"/>
  <circle cx="1118" cy="70" r="7" fill="#00e676"/>
  <text x="1132" y="77" font-size="20" fill="#e6edf3">online</text>
  <rect x="1210" y="59" width="11" height="22" fill="#00e676">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
